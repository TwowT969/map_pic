<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <!-- iOS 安全区域 / Android 沉浸式 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#4a90d9" />
  <!-- Capacitor CSP：允许加载高德地图资源 -->
  <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob: filesystem:; img-src * data: blob:; connect-src * blob:;" />
  <title>地图相册</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; overflow: hidden; }
  </style>
</head>
<body>
  <div id="app"></div>
  <!-- 高德安全密钥：必须在 loader.js 加载前设置（官方 §1.3） -->
  <script>
    window._AMapSecurityConfig = { securityJsCode: '' }
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
