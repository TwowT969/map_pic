<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <!-- iOS 安全区域 / Android 沉浸式 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#101b3c" />
  <!-- Capacitor CSP：允许加载高德地图资源 -->
  <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob: filesystem:; img-src * data: blob:; connect-src * blob:;" />
  <title>地图相册</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; overflow: hidden; }

    /* ===== 海报风加载封面（星夜地图） ===== */
    #boot {
      position: fixed; inset: 0; z-index: 9999;
      background: linear-gradient(160deg, #0c1531 0%, #1a2a5c 52%, #2e5288 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #fff; overflow: hidden; user-select: none;
    }
    #boot::before { /* 海报边框 */
      content: ''; position: absolute; inset: 3.2%;
      border: 1px solid rgba(157,184,232,.38); pointer-events: none;
    }
    #boot::after { /* 顶部微光 */
      content: ''; position: absolute; top: -30%; left: 50%; transform: translateX(-50%);
      width: 120%; height: 55%; border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(79,124,214,.30), transparent 65%);
      pointer-events: none;
    }
    .boot-stars { position: absolute; inset: 0; pointer-events: none; }
    .boot-stars i {
      position: absolute; width: 2px; height: 2px; border-radius: 50%;
      background: rgba(207,224,255,.75); animation: twinkle 2.8s ease-in-out infinite;
    }
    @keyframes twinkle { 0%,100% { opacity:.25 } 50% { opacity:.95 } }
    .boot-pin-wrap { position: relative; width: 132px; height: 150px; margin-bottom: 30px; }
    .boot-ring {
      position: absolute; left: 50%; top: 46px; width: 90px; height: 90px; margin: -45px 0 0 -45px;
      border: 1.5px solid rgba(207,224,255,.5); border-radius: 50%;
      animation: radar 2.6s cubic-bezier(.2,.6,.4,1) infinite; pointer-events: none;
    }
    .boot-ring.r2 { animation-delay: .85s }
    .boot-ring.r3 { animation-delay: 1.7s }
    @keyframes radar { 0% { transform: scale(.55); opacity:.85 } 100% { transform: scale(2.6); opacity:0 } }
    .boot-pin {
      position: absolute; left: 50%; top: 0; transform: translateX(-50%);
      width: 84px; height: 84px; border-radius: 50%;
      background: linear-gradient(175deg, #ffb454, #f08c2e);
      box-shadow: 0 14px 34px rgba(0,0,0,.45), inset 0 -6px 14px rgba(200,110,20,.55);
      animation: floaty 2.4s ease-in-out infinite;
    }
    .boot-pin::before { /* 针尾 */
      content: ''; position: absolute; left: 50%; top: 66px; transform: translateX(-50%);
      border-left: 15px solid transparent; border-right: 15px solid transparent;
      border-top: 40px solid #f08c2e;
    }
    .boot-pin::after { /* 针头内嵌照片：山与太阳 */
      content: ''; position: absolute; inset: 15px; border-radius: 50%;
      background:
        radial-gradient(circle at 68% 26%, #ffcf5c 0 11px, transparent 12px),
        linear-gradient(200deg, #d7e9ff 0 55%, transparent 55%),
        linear-gradient(155deg, transparent 46%, #4a6fa5 47% 72%, #7fa3d9 73% 100%);
      box-shadow: 0 0 0 5px rgba(255,255,255,.95);
    }
    @keyframes floaty { 0%,100% { transform: translateX(-50%) translateY(0) } 50% { transform: translateX(-50%) translateY(-9px) } }
    .boot-kicker {
      font-size: 11px; letter-spacing: .42em; color: rgba(188,210,245,.66);
      margin-bottom: 14px; padding-left: .42em;
    }
    .boot-title {
      font-size: 40px; font-weight: 700; letter-spacing: .14em; padding-left: .14em;
      text-shadow: 0 4px 22px rgba(0,0,0,.5);
    }
    .boot-tag { font-size: 14px; color: rgba(207,224,255,.85); margin-top: 12px; letter-spacing: .12em; padding-left: .12em; }
    .boot-bar { width: 132px; height: 3px; border-radius: 2px; margin-top: 26px; overflow: hidden; background: rgba(207,224,255,.16); }
    .boot-bar i { display: block; width: 40%; height: 100%; border-radius: 2px; background: linear-gradient(90deg,#ffb454,#ffd39a); animation: slide 1.1s ease-in-out infinite; }
    @keyframes slide { 0% { transform: translateX(-110%) } 100% { transform: translateX(360%) } }
    .boot-ver { position: absolute; bottom: 4.8%; font-size: 10px; letter-spacing: .3em; color: rgba(157,184,232,.5); padding-left: .3em; }
  </style>
</head>
<body>
  <div id="app">
    <!-- 海报风加载封面：Vue 挂载后整块替换 -->
    <div id="boot">
      <div class="boot-stars">
        <i style="left:12%;top:18%"></i><i style="left:28%;top:9%;animation-delay:.4s"></i>
        <i style="left:44%;top:14%;animation-delay:.9s"></i><i style="left:63%;top:8%;animation-delay:.2s"></i>
        <i style="left:81%;top:16%;animation-delay:.7s"></i><i style="left:90%;top:30%;animation-delay:1.1s"></i>
        <i style="left:8%;top:38%;animation-delay:1.4s"></i><i style="left:18%;top:62%;animation-delay:.6s"></i>
        <i style="left:86%;top:58%;animation-delay:1.8s"></i><i style="left:74%;top:74%;animation-delay:.3s"></i>
        <i style="left:30%;top:80%;animation-delay:1.2s"></i><i style="left:52%;top:86%;animation-delay:.8s"></i>
      </div>
      <div class="boot-pin-wrap">
        <span class="boot-ring"></span><span class="boot-ring r2"></span><span class="boot-ring r3"></span>
        <div class="boot-pin"></div>
      </div>
      <div class="boot-kicker">EXPLORE · CAPTURE · PIN</div>
      <div class="boot-title">地图相册</div>
      <div class="boot-tag">把每一次打卡，钉在地图上</div>
      <div class="boot-bar"><i></i></div>
      <div class="boot-ver">MAP ALBUM · v1.3.5</div>
    </div>
  </div>
  <!-- 高德安全密钥：必须在 loader.js 加载前设置（官方 §1.3） -->
  <script>
    window._AMapSecurityConfig = { securityJsCode: '' }
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
