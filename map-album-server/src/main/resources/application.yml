# 地图相册 App 后端 - 公共配置
server:
  port: 48081
  servlet:
    context-path: /api   # 对齐技术方案 /api/* 接口路径

spring:
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  application:
    name: map-album-server
  profiles:
    active: local
  # 数据源（MySQL 8）
  datasource:
    url: jdbc:mysql://localhost:3306/map_album?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  # Redis
  redis:
    host: localhost
    port: 6379
    database: 0
    timeout: 3000ms

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: org.lxp.mapalbum.dal.dataobject
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 日志
logging:
  level:
    root: INFO
    org.lxp.mapalbum: INFO

# 高德地图（技术方案 §2；凭证通过环境变量或 application-local.yml 注入，禁止提交真实值）
#  - web:  Web服务 API Key，后端 HTTP API 调用用，不暴露给前端
#  - js:   Web端 JS API Key + 安全密钥(securityJsCode)，前端渲染地图用，后端集中托管后下发
amap:
  web:
    key: ${AMAP_WEB_KEY:}
  js:
    key: ${AMAP_JS_KEY:}
    security-code: ${AMAP_JS_SECURITY_CODE:}

# 腾讯位置服务（H5 地图底图 + WebService 输入提示/POI 搜索）
tencent:
  key: ${TENCENT_MAP_KEY:}

# ===== 以下中间件待对应功能引入依赖后启用 =====
# Kafka（图片处理异步流水线，技术方案 §8.1）：
#   1) 在 map-album-server/pom.xml 增加 spring-kafka 依赖（版本由 Spring Boot BOM 管理）
#   2) 取消下方注释
# spring:
#   kafka:
#     bootstrap-servers: localhost:9092
#     consumer:
#       group-id: map-album
#       auto-offset-reset: latest
#     producer:
#       acks: all
#
# 阿里云 OSS（照片存储，技术方案 §7.4）：
#   敏感信息通过环境变量或 application-local.yml 注入，禁止提交真实值（KSHG 规范 §14.2、红线 #9）。
#   bucket 设为「私有」，读访问走签名 URL（OssClient.signedUrl，有效期 oss.signed-url-expire 秒）。
oss:
  endpoint: oss-cn-beijing.aliyuncs.com
  access-key-id: ${OSS_ACCESS_KEY_ID:}
  access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
  bucket-name: ${OSS_BUCKET_NAME:}
  signed-url-expire: 3600

# ===== storage (test phase: local disk; switch to oss in production) =====
app:
  storage:
    type: local
  upload:
    path: /root/map_pic/uploads
  version:
    code: 5
    name: "1.2.0"
    url: "http://59.110.53.169/apk/map-album-v1.2.0-debug.apk"
    notes: 本地化存储：图片只存设备本地，服务器仅存元数据；海报修复
